<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trade</title>
<style>
:root{
  --bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;
  --up:#1f7a4d;--down:#b23b3b;--p1:#2f7fa3;--ff:#c47a1c;--warn:#a86a00;--chip:#efede6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--card:#1d1d1b;--ink:#ecebe6;--mute:#9b9a94;--line:#2f2e2b;
  --up:#4cc38a;--down:#e5676b;--p1:#5fb6d9;--ff:#f0a23c;--warn:#e0a63a;--chip:#2a2926;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:34px 0 10px}
.sub{color:var(--mute);font-size:13px}
.status{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status.warn{border-left:4px solid var(--warn)}
.status.bad{border-left:4px solid var(--down)}
.leagues{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.league{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.league h3{margin:0;font-size:15px}
.league .rule{color:var(--mute);font-size:12px;margin:2px 0 10px}
.team{display:grid;grid-template-columns:4px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.bar{border-radius:2px}
.bar.p1{background:var(--p1)}.bar.ff{background:var(--ff)}
.bar.mix{background:linear-gradient(var(--p1) 50%,var(--ff) 50%)}
.tname{font-weight:600}
.tdesc{color:var(--mute);font-size:12px}
.tnum{text-align:right}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.idle{color:var(--mute);font-size:13px;grid-column:2/4}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;font-size:13px;border-top:1px solid var(--line);white-space:nowrap}
th{background:var(--chip);color:var(--mute);font-weight:600;border-top:0}
td.n,th.n{text-align:right}
.tw{overflow-x:auto;border-radius:12px}
.chip{display:inline-block;padding:0 6px;border-radius:6px;background:var(--chip);font-size:11px;color:var(--mute);margin-right:3px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details p,details li{font-size:13px;color:var(--mute)}
.zd{font-size:13px;margin:4px 0}
.zd .k{display:inline-block;min-width:84px;color:var(--mute)}
footer{margin-top:40px;color:var(--mute);font-size:12px}
@media (max-width:720px){.leagues{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Paper Trade <span id="season"></span></h1>
  <div class="sub" id="meta">—</div>
  <div class="status" id="today" hidden></div>

  <h2>S2 · 当前账本 <span class="sub" id="s2-sub"></span></h2>
  <div class="league" id="s2"></div>

  <h2>S1 · 收尾中 <span class="sub" id="s1-sub"></span></h2>
  <div class="leagues" id="boards"></div>

  <h2>在场持仓 <span class="sub" id="open-n"></span></h2>
  <div class="tw"><table id="open"></table></div>

  <h2>已平仓 <span class="sub" id="closed-n"></span></h2>
  <div class="tw"><table id="closed"></table></div>

  <h2>有候选却零腿的日子</h2>
  <div id="zero"></div>

  <details>
    <summary>口径与实验设计</summary>
    <ul id="notes"></ul>
  </details>

  <footer>数据：<span class="mono">tools/pt_update_page.py</span> · 报价 moomoo（股票）/ OKX（perp）· 从不猜价 · 最后更新 <span id="asof">—</span></footer>
</div>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const fmt=(x,d=2)=>x==null||isNaN(x)?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sign=(x,d=1)=>x==null||isNaN(x)?"—":(x>0?"+":x<0?"−":"")+fmt(Math.abs(x),d)+"%";
const cls=x=>x>0?"up":x<0?"down":"";
const BAR={G1:"p1",G2:"mix",G5:"ff"};
const REASON={stop_touched:"止损",max_hold:"到期（20 日）",expiry:"期权到期"};

fetch("data.json?"+Date.now()).then(r=>r.json()).then(render).catch(e=>{
  document.getElementById("meta").textContent="读不到 data.json："+e;
});

function legPct(l){            // 在场腿浮动：股票腿 = 权利金涨跌；perp 腿 = 保证金涨跌（3x）
  if(l.mark==null||!l.entry) return null;
  const r=l.mark/l.entry-1;
  return (l.branch==="perp"?3:1)*r*100;
}

function render(d){
  document.getElementById("season").textContent="";
  const age=d.asof_iso?Math.round((Date.now()-new Date(d.asof_iso))/36e5*10)/10:null;
  document.getElementById("meta").innerHTML=
    `S1 开赛 ${esc(d.kickoff||"—")} · 数据 ${esc(d.asof_et||d.asof||"—")}`+
    (age!=null?`（${age} 小时前）`:"");
  document.getElementById("asof").textContent=d.asof||"—";

  // ── 今日一行：只说一件事 ──
  const z=d.zero_days||[], last=z[z.length-1];
  const T=document.getElementById("today");
  let line=null, kind="";
  if(d.day_status&&d.day_status.kind==="pre_signal"){
    line="今天的信号还没出（ET 09:32 / MYT 21:32 建仓）。";
  }
  if(last){
    const w=Object.entries(last.why||{}).map(([b,t])=>(b==="perp"?"perp":"股票")+"："+t).join("；");
    const head=last.kind==="fail"?`🔴 ${last.date_et} 有候选却没建成`:`${last.date_et} 零腿 —— 规则挡下，不是故障`;
    line=(line?line+"<br>":"")+`<b>上一个建仓日</b> ${esc(head)}（${esc(w)}）`;
    kind=last.kind==="fail"?"bad":"warn";
  }
  if(line){T.innerHTML=line;T.className="status "+kind;T.hidden=false;}

  // ── 记分板 ──
  const pos=d.positions||[];
  const openL=d.open_positions||[];
  const S=d.seasons||{}, S2=S.S2||{}, S1=S.S1||{};
  const upDown=(gid,season,branch)=>{
    const m=openL.filter(l=>(l.tags||[]).includes(gid)&&(l.season||"S1")===season&&(!branch||(branch==="perp")===(l.branch==="perp")));
    const u=m.filter(l=>(legPct(l)||0)>0).length; return [u,m.length-u];
  };
  // S2：一个账户（股票 + perp 合计）
  const nav=S2.account||10000;
  document.getElementById("s2-sub").textContent=S2.from?`${S2.from} 起的腿 · 独立风控`:"";
  document.getElementById("s2").innerHTML=`<div class="rule">${esc(S2.rules||"")}</div>`+
    (S2.teams||[]).map(t=>{
      const T=t.total;
      if(!T){return `<div class="team"><div class="bar ${BAR[t.gid]||"ff"}"></div><div><div class="tname">${esc(t.gid)} · ${esc(t.name||"")}</div>
        <div class="tdesc">还没开过一腿</div></div><div class="tnum small">—</div></div>`;}
      const eq=nav-T.cost+T.val, eqPct=(eq/nav-1)*100, [u,dn]=upDown(t.gid,"S2");
      const br=Object.entries(t.by_branch||{}).map(([k,b])=>`${k==="perp"?"perp":"股票"} ${b.legs} 腿 ${sign(b.cost?(b.val/b.cost-1)*100:null)}`).join(" · ");
      return `<div class="team"><div class="bar ${BAR[t.gid]||"ff"}"></div>
        <div><div class="tname">${esc(t.gid)} · ${esc(t.name||"")}</div><div class="tdesc">${md(t.full||"")}</div>
        <div class="small">已平 ${T.wins}胜 ${T.losses}负 · 在场 ${u}涨 ${dn}跌 · ${esc(br)}</div></div>
        <div class="tnum"><div class="big ${cls(eqPct)}">${sign(eqPct)}</div>
        <div class="small">账户 ${fmt(eq,0)} / ${fmt(nav,0)} USD</div></div></div>`;
    }).join("")+(S2.legs?"":`<div class="small" style="margin-top:6px">S2 还没有腿。下一次建仓：ET 09:32 / MYT 21:32。</div>`);

  // S1：原来两条联赛、各自的尺子；只算 S1 的腿
  const S1T={}; (S1.teams||[]).forEach(t=>S1T[t.gid]=t);
  document.getElementById("s1-sub").textContent=S1.until?`${S1.until} 之前开的腿 · 照旧规则跑到出场`:"";
  document.getElementById("boards").innerHTML=(d.leagues||[]).map(L=>{
    const cap=L.capital_per_team||0;
    const rows=(L.teams||[]).map(t=>{
      const b=((S1T[t.gid]||{}).by_branch||{})[L.id];
      if(!b||!b.cost){
        return `<div class="team"><div class="bar ${BAR[t.gid]||"ff"}"></div>
          <div><div class="tname">${esc(t.gid)} · ${esc(t.name)}</div>
          <div class="tdesc">S1 没开过腿</div></div><div class="tnum small">—</div></div>`;
      }
      const eq=cap-b.cost+b.val, eqPct=cap?(eq/cap-1)*100:null, [u,dn]=upDown(t.gid,"S1",L.id);
      return `<div class="team"><div class="bar ${BAR[t.gid]||"ff"}"></div>
        <div><div class="tname">${esc(t.gid)} · ${esc(t.name)}</div>
        <div class="small">已平 ${b.wins}胜 ${b.losses}负 · 在场 ${u}涨 ${dn}跌</div></div>
        <div class="tnum"><div class="big ${cls(eqPct)}">${sign(eqPct)}</div>
        <div class="small">权益 ${fmt(eq,0)} / ${fmt(cap,0)} ${esc(L.currency)}</div>
        <div class="small">投入回报 ${sign(b.cost?(b.val/b.cost-1)*100:null)}</div></div></div>`;
    }).join("");
    return `<div class="league"><h3>${esc(L.name)} <span class="sub">${esc(L.venue)}</span></h3>
      <div class="rule">每队 ${fmt(cap,0)} ${esc(L.currency)} · 每腿 ${fmt(L.per_leg,0)} · 上限 ${L.max_legs} 腿</div>${rows}</div>`;
  }).join("");

  // ── 在场持仓 ──
  const og=[...openL].sort((a,b)=>(b.held_days||0)-(a.held_days||0));
  document.getElementById("open-n").textContent=og.length+" 腿";
  document.getElementById("open").innerHTML=`<tr><th>标的</th><th>支线</th><th>归属</th>
    <th class="n">建仓</th><th class="n">现</th><th class="n">浮动</th><th class="n">离止损</th><th class="n">已持</th></tr>`+
    og.map(l=>{const p=legPct(l);return `<tr><td><b>${esc(l.symbol)}</b></td>
      <td>${l.branch==="perp"?"perp 3x":"1 月 ATM call"}</td>
      <td><span class="chip">${esc(l.season||"S1")}</span>${(l.tags||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</td>
      <td class="n">${fmt(l.entry)}</td><td class="n">${fmt(l.mark)}</td>
      <td class="n ${cls(p)}">${sign(p)}</td><td class="n">${l.to_stop_pct==null?"—":fmt(l.to_stop_pct,1)+"%"}</td>
      <td class="n">${l.held_days??"—"}/${l.max_hold_days??20}</td></tr>`}).join("");

  // ── 已平仓 ──
  const cl=pos.filter(l=>l.status==="closed").sort((a,b)=>String(b.exit_date_et).localeCompare(String(a.exit_date_et)));
  const tg=l=>Object.entries(l.tags||{}).filter(([k,v])=>v).map(([k])=>k.toUpperCase());
  const wins=cl.filter(l=>(l.pnl||0)>0).length;
  document.getElementById("closed-n").textContent=`${cl.length} 腿 · 赚 ${wins} 亏 ${cl.length-wins}`;
  document.getElementById("closed").innerHTML=`<tr><th>平仓日</th><th>标的</th><th>支线</th><th>归属</th>
    <th class="n">建仓 → 平仓</th><th class="n">盈亏</th><th>原因</th></tr>`+
    cl.map(l=>`<tr><td>${esc(l.exit_date_et)}</td><td><b>${esc(l.symbol)}</b></td>
      <td>${l.branch==="perp"?"perp":"call"}</td><td><span class="chip">${String(l.entry_date_et||"")>=(S2.from||"9999")?"S2":"S1"}</span>${tg(l).map(g=>`<span class="chip">${g}</span>`).join("")}</td>
      <td class="n">${fmt(l.entry)} → ${fmt(l.exit)}</td><td class="n ${cls(l.pnl_pct)}">${sign(l.pnl_pct)}</td>
      <td>${esc(REASON[l.exit_reason]||l.exit_reason||"")}</td></tr>`).join("");

  // ── 零腿日 ──
  const rule=z.filter(x=>x.kind==="rule"), fail=z.filter(x=>x.kind==="fail");
  const cats={};
  rule.forEach(x=>Object.values(x.why||{}).forEach(t=>String(t).split(" · ").forEach(s=>{const k=s.replace(/×\d+$/,"");cats[k]=(cats[k]||0)+1;})));
  document.getElementById("zero").innerHTML=
    `<div class="status ${fail.length?"bad":""}">共 ${z.length} 天：<b>${rule.length} 天规则挡下</b>（按「支线×天」数：${
      Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,n])=>esc(k)+" "+n).join(" · ")||"—"}），`+
    `<b>${fail.length} 天真故障</b>${fail.length?"："+fail.map(x=>esc(x.date_et)+" "+esc(Object.values(x.why).find(t=>!/上限|预算|已持有|到期日|永续/.test(t))||"")).join("；"):""}</div>`+
    `<details><summary>逐日明细</summary>`+z.map(x=>`<div class="zd"><span class="k">${esc(x.date_et)}</span>${x.kind==="fail"?"🔴 ":""}`+
      `股票 ${x.legs.equity} 腿 / perp ${x.legs.perp} 腿 · `+Object.entries(x.why||{}).map(([b,t])=>(b==="perp"?"perp":"股票")+"："+esc(t)).join("；")+`</div>`).join("")+`</details>`;

  // ── 口径（折叠）──
  const q=d.quote_context||{}, notes=[];
  if(d.question) notes.push("<b>问的是</b>："+md(d.question));
  if(q.returns) notes.push(md(q.returns));
  if(q.pricing) notes.push(md(q.pricing));
  if(q.equity) notes.push("股票报价："+md(q.equity));
  if(q.perp) notes.push("perp 报价："+md(q.perp));
  notes.push("「已平 x胜 y负」只算平掉的腿：股票腿按规则 −50% 止损、无止盈、最多 20 天，赢的腿要拿到第 20 天才平，所以已平一栏天然偏向输家 —— 同时看「在场 涨/跌」。");
  document.getElementById("notes").innerHTML=notes.map(n=>`<li>${n}</li>`).join("");
}
</script>
</body>
</html>
